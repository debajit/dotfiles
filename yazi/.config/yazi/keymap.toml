# My bookmarks

[[mgr.prepend_keymap]]
on   = [ "g", "a" ]
run  = "cd ~/Archive"
desc = "Cd to ~/Archive"

[[mgr.prepend_keymap]]
on   = [ "g", "b" ]
run  = "cd ~/Archive/Bookshelf/Books"
desc = "Cd to ~/Archive/Bookshelf/Books"

[[mgr.prepend_keymap]]
on   = [ "g", "B" ]
run  = "cd ~/Work/Knowledge/Bookmarks/"
desc = "Cd to ~/Work/Knowledge/Bookmarks/"

[[mgr.prepend_keymap]]
on   = [ "g", "m" ]
run  = "cd ~/Archive/Music"
desc = "Cd to ~/Archive/Music"

[[mgr.prepend_keymap]]
on   = [ "g", "n" ]
run  = "cd ~/Archive/Knowledge/Notes"
desc = "Cd to ~/Archive/Knowledge/Notes"

[[mgr.prepend_keymap]]
on   = [ "g", "p" ]
run  = "cd ~/Archive/Pictures/Photography"
desc = "Cd to ~/Archive/Pictures/Photography"

[[mgr.prepend_keymap]]
on   = [ "g", "P" ]
run  = "cd ~/Archive/Knowledge/Papers/"
desc = "Cd to ~/Archive/Knowledge/Papers/"

[[mgr.prepend_keymap]]
on   = [ "g", "r" ]
run  = "cd ~/Archive/Receipts"
desc = "Cd to ~/Archive/Receipts"

[[mgr.prepend_keymap]]
on   = [ "g", "s" ]
run  = "cd ~/Pictures/Screenshots"
desc = "Cd to ~/Pictures/Screenshots"


# Navigation Keys

# Recent directories
[[mgr.prepend_keymap]]
on   = "<A-k>"
run  = "plugin zoxide"
desc = "Jump to a recent directory via zoxide"

[[mgr.prepend_keymap]]
on   = "<C-t>"
run  = "plugin fzf"
desc = "Pick files via fzf"

# Navigate to a nested directory, just like with fzf on the shell
[[mgr.prepend_keymap]]
on   = "<A-c>"
run  = '''shell --block -- dir="$(fd --type d --hidden --follow --exclude .git --absolute-path | fzf)" && [ -n "$dir" ] && ya emit cd
"$dir"; exit 0'''
desc = "Cd to a directory via fzf"


# Bookmarks Plugin
# https://github.com/dedukun/bookmarks.yazi

[[mgr.prepend_keymap]]
on = [ "m" ]
run = "plugin bookmarks --args=save"
desc = "Save current position as a bookmark"

[[mgr.prepend_keymap]]
on = [ "'" ]
run = "plugin bookmarks --args=jump"
desc = "Jump to a bookmark"

[[mgr.prepend_keymap]]
on = [ "b", "d" ]
run = "plugin bookmarks --args=delete"
desc = "Delete a bookmark"

[[mgr.prepend_keymap]]
on = [ "b", "D" ]
run = "plugin bookmarks --args=delete_all"
desc = "Delete all bookmarks"


# toggle-pane.yazi Plugin
# https://github.com/yazi-rs/plugins/tree/main/toggle-pane.yazi
[[mgr.prepend_keymap]]
on   = "i"
run  = "plugin toggle-pane max-preview"
desc = "Maximize or restore the preview pane"

# open-with-cmd.yazi
# https://github.com/Ape/open-with-cmd.yazi

[[mgr.prepend_keymap]]
on   = "o"
run  = "plugin open-with-cmd --args=block"
desc = "Open with command in the terminal"

[[mgr.prepend_keymap]]
on   = "O"
run  = "plugin open-with-cmd"
desc = "Open with command"


# Smart-enter plugin
# See https://github.com/Ape/smart-enter.yazi
[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin --sync smart-enter"
desc = "Enter the child directory, or open the file"
