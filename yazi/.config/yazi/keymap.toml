# Navigation Keys

# Recent directories
[[mgr.prepend_keymap]]
on   = "<A-k>"
run  = "plugin zoxide"
desc = "Jump to a recent directory via zoxide"

[[mgr.prepend_keymap]]
on   = "<C-t>"
run  = "plugin fzf"
desc = "Pick files via fzf"

[[mgr.prepend_keymap]]
on   = "<D-k>"
run  = "shell --block -- kitten choose_files >/dev/null"
desc = "Pick files via Kitty's chooser"

# Sorting
[[mgr.prepend_keymap]]
on   = "<A-d>"
run  = "plugin toggle-dir-first"
desc = "Toggle directories first"

# Navigate to a nested directory, just like with fzf on the shell
# Keep `ya emit cd "$dir"` on one line because TOML preserves newlines in this
# literal string, and the shell would otherwise treat "$dir" as a new command.
# Exit successfully when fzf is canceled so Yazi does not report a process error.
[[mgr.prepend_keymap]]
on   = "<A-c>"
run  = '''shell --block -- dir="$(fd --type d --hidden --follow --exclude .git --absolute-path | fzf)" || exit 0; [ -n "$dir" ] && ya emit cd "$dir"; exit 0'''
desc = "Cd to a directory via fzf"


# toggle-pane.yazi Plugin
# https://github.com/yazi-rs/plugins/tree/main/toggle-pane.yazi
[[mgr.prepend_keymap]]
on   = "i"
run  = "plugin toggle-pane max-preview"
desc = "Maximize or restore the preview pane"

# open-with-cmd.yazi
# https://github.com/Ape/open-with-cmd.yazi

[[mgr.prepend_keymap]]
on   = "o"
run  = "plugin open-with-cmd --args=block"
desc = "Open with command in the terminal"

[[mgr.prepend_keymap]]
on   = "O"
run  = "plugin open-with-cmd"
desc = "Open with command"
