#
# yazi.toml
# Yazi configuration.
#
# Yazi merges its default configuration in
# https://github.com/sxyazi/yazi/blob/shipped/yazi-config/preset/yazi-default.toml
# with this file.
#
#     [open] → Routing
#   [opener] → Command
#
# To change how a file is opened, add a prepend rule so that we can control the routing
#

[mgr]
sort_by = "mtime"
sort_reverse = true
sort_dir_first = false

[opener]
edit = [
    { run = '$EDITOR %s', orphan = true, desc = "Edit", for = "unix" },
]

open_html = [
    { run = 'open %s', desc = "Open in browser", for = "macos" },
    { run = 'xdg-open %s1', desc = "Open in browser", for = "linux" },
]

open_image = [
    { run = 'feh -Zr %s', desc = "Open Image" },
]

play = [
  { run = "xdg-open %s1", orphan = true, desc = "Play" },
]

# EasyTAG treats its argument as a place to browse, not a file to open: it
# navigates to the parent directory and then selects the first file in the
# list, ignoring the filename it was given. There is no flag, D-Bus method,
# or setting that changes this. See specs/issues-found.md.
tag = [
    { run = 'easytag %s1', orphan = true, desc = 'Tag' }
]

spectrogram = [
    { run = 'spek %s1', orphan = true, desc = 'Show spectrogram' }
]

edit_pdf = [
    { run = 'xournalpp %s1', orphan = true, desc = "Edit", for = "linux" },
]

open_bookmark = [
  { run = 'open-bookmark %s', orphan = true, desc = "Open bookmark" },
]

copy_bookmark = [
  { run = 'copy-bookmark %s1', desc = "Copy bookmark" },
  { run = 'copy-bookmark-as-markdown %s1', desc = "Copy as Markdown" },
]

copy_path = [
  { run = '''printf '%%s' %s1 | pbcopy''', desc = "Copy Path", for = "macos" },
  { run = '''printf '%%s' %s1 | wl-copy''', desc = "Copy Path", for = "linux" },
]

[open]
rules = [
  { url = "*.{htm,html}", use = [ "open_html", "copy_path" ] },
  { url = "*.md", use = [ "edit", "copy_path", "open", "reveal" ] },
  { url = "*.markdown", use = [ "edit", "copy_path", "open", "reveal" ] },
  { mime = "audio/*", use = [ "play", "copy_path", "tag", "spectrogram", "reveal" ] },
  { mime = "application/pdf", use = [ "open", "copy_path", "edit_pdf", "reveal" ] },
  { url = "*.bookmark", use = [ "open_bookmark", "copy_path", "copy_bookmark", "edit" ] },
  { mime = "folder/*", use = [ "edit", "copy_path", "open", "reveal" ] },
  { mime = "text/*", use = [ "edit", "copy_path", "reveal" ] },
  { mime = "image/*", use = [ "open_image", "copy_path", "open", "reveal" ] },
  { mime = "{audio,video}/*", use = [ "play", "copy_path", "reveal" ] },
  { mime = "application/{json,ndjson,javascript,wine-extension-ini}", use = [ "edit", "copy_path", "reveal" ] },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [ "extract", "copy_path", "reveal" ] },
  { mime = "inode/empty", use = [ "edit", "copy_path", "reveal" ] },
  { mime = "vfs/{absent,stale}", use = [ "download", "copy_path" ] },
  { mime = "trash/**", use = [ "open", "copy_path", "trash" ] },
  { url = "*", use = [ "open", "copy_path", "reveal" ] },
]

[[plugin.prepend_previewers]]
url = "*.md"
run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"'
