font_size 14.4

# Kitty launched from the Dock does not inherit the shell's editor or PATH.
# Use the stable app path and reuse a GUI frame, starting the daemon if needed.
editor /Applications/Emacs.app/Contents/MacOS/bin/emacsclient -n -r --alternate-editor=

# Use left Option key as Alt/Meta key. See
# https://sw.kovidgoyal.net/kitty/conf.html#os-specific-tweaks
macos_option_as_alt left

macos_thicken_font 0.1
