# What kitty does when you ctrl+shift+click a hyperlink.
#
# Loaded automatically from ~/.config/kitty/open-actions.conf -- no `include`
# in kitty.conf is needed.

# Open a file:// URL carrying a #LINE fragment at that line in the running
# Emacs server. Such fragments come from `rg --hyperlink-format=kitty` (see the
# rg alias in .aliases.sh) and from `kitten hyperlinked-grep`.
#
# --type=background:   run emacsclient without creating a kitty window
#               -n:    don't block waiting for the buffer to be closed
#               -r:    reuse the existing GUI frame instead of making a new one
# --alternate-editor=: start the Emacs daemon if it isn't running
protocol file
fragment_matches [0-9]+
action launch --type=background --cwd=current emacsclient -n -r --alternate-editor= +${FRAGMENT} ${FILE_PATH}

# Plain text files with no fragment, e.g. a bare path in the output of ls.
protocol file
mime text/*
action launch --type=background --cwd=current emacsclient -n -r --alternate-editor= ${FILE_PATH}
