# Rootless podman registry config (overrides /etc/containers/registries.conf).
#
# Resolve short image names (e.g. `nginx`, `postgres:16`) against Docker Hub
# only, matching Docker's behavior. Listing a single registry avoids the
# ambiguity that makes podman prompt or fail, and the name-squatting risk of
# searching several registries. Use fully qualified names for anything else
# (e.g. ghcr.io/owner/image, quay.io/org/image).
unqualified-search-registries = ["docker.io"]
