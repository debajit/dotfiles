<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!--
    Hoefler & Co. ship Ideal Sans, Verlag, Verlag Compressed and Verlag
    Condensed with a compressed OS/2.usWeightClass range (250-450 rather
    than 100-900). Bold is stamped 400 - the standard value for Regular -
    so fontconfig hands out the Bold face for normal-weight requests, and
    Book reads as a light weight.

    Operator Mono has the same defect but is deliberately left alone.

    These target="scan" rules rewrite the weight as the fonts are cached,
    mapping each face onto the standard fontconfig weight constants.
    Book is mapped to "regular" so it becomes the family default.

    Style tests use compare="contains" so each rule covers the roman and
    the italic ("Book" and "Book Italic") in one block.

    ORDER MATTERS. compare="contains" is a case-INSENSITIVE substring
    test, and later edits overwrite earlier ones, so where one style name
    contains another the broader rule must come first:

      "Light" is inside "Extra Light"  ->  Light before Extra Light
      "Bold"  is inside "Semibold"     ->  Bold  before Semibold

    Run `fc-cache -rf` after changing this file.
  -->

  <!-- ==================== Ideal Sans ==================== -->

  <match target="scan">
    <test name="family"><string>Ideal Sans</string></test>
    <test name="style" compare="contains"><string>Thin</string></test>
    <edit name="weight"><const>thin</const></edit>
  </match>

  <match target="scan">
    <test name="family"><string>Ideal Sans</string></test>
    <test name="style" compare="contains"><string>Light</string></test>
    <edit name="weight"><const>light</const></edit>
  </match>

  <!-- must follow the Light rule above; "Extra Light" contains "Light" -->
  <match target="scan">
    <test name="family"><string>Ideal Sans</string></test>
    <test name="style" compare="contains"><string>Extra Light</string></test>
    <edit name="weight"><const>extralight</const></edit>
  </match>

  <match target="scan">
    <test name="family"><string>Ideal Sans</string></test>
    <test name="style" compare="contains"><string>Book</string></test>
    <edit name="weight"><const>regular</const></edit>
  </match>

  <match target="scan">
    <test name="family"><string>Ideal Sans</string></test>
    <test name="style" compare="contains"><string>Medium</string></test>
    <edit name="weight"><const>medium</const></edit>
  </match>

  <match target="scan">
    <test name="family"><string>Ideal Sans</string></test>
    <test name="style" compare="contains"><string>Bold</string></test>
    <edit name="weight"><const>bold</const></edit>
  </match>

  <!-- must follow the Bold rule above; "Semibold" contains "bold" -->
  <match target="scan">
    <test name="family"><string>Ideal Sans</string></test>
    <test name="style" compare="contains"><string>Semibold</string></test>
    <edit name="weight"><const>semibold</const></edit>
  </match>

  <match target="scan">
    <test name="family"><string>Ideal Sans</string></test>
    <test name="style" compare="contains"><string>Black</string></test>
    <edit name="weight"><const>black</const></edit>
  </match>

  <!-- ==================== Verlag ==================== -->

  <match target="scan">
    <test name="family"><string>Verlag</string></test>
    <test name="style" compare="contains"><string>Book</string></test>
    <edit name="weight"><const>regular</const></edit>
  </match>

  <match target="scan">
    <test name="family"><string>Verlag</string></test>
    <test name="style" compare="contains"><string>Bold</string></test>
    <edit name="weight"><const>bold</const></edit>
  </match>

  <!-- ================ Verlag Compressed ================ -->

  <!--
    A family of its own ("Verlag Compressed"), so the plain Verlag rules
    above do not reach it. It ships the full five-weight range, and every
    face lands wrong: fontconfig scans Bold as 80 - exactly its "regular"
    constant - Book as 52.5 (a light weight) and Black as 90 (barely
    above regular).
  -->

  <match target="scan">
    <test name="family"><string>Verlag Compressed</string></test>
    <test name="style" compare="contains"><string>Light</string></test>
    <edit name="weight"><const>light</const></edit>
  </match>

  <!-- must follow the Light rule above; "Extra Light" contains "Light" -->
  <match target="scan">
    <test name="family"><string>Verlag Compressed</string></test>
    <test name="style" compare="contains"><string>Extra Light</string></test>
    <edit name="weight"><const>extralight</const></edit>
  </match>

  <match target="scan">
    <test name="family"><string>Verlag Compressed</string></test>
    <test name="style" compare="contains"><string>Book</string></test>
    <edit name="weight"><const>regular</const></edit>
  </match>

  <match target="scan">
    <test name="family"><string>Verlag Compressed</string></test>
    <test name="style" compare="contains"><string>Bold</string></test>
    <edit name="weight"><const>bold</const></edit>
  </match>

  <match target="scan">
    <test name="family"><string>Verlag Compressed</string></test>
    <test name="style" compare="contains"><string>Black</string></test>
    <edit name="weight"><const>black</const></edit>
  </match>

  <!-- ================= Verlag Condensed ================= -->

  <!--
    Also a family of its own ("Verlag Condensed"), with the same five
    weights and the same scanned values as Verlag Compressed above:
    Extra Light 47.5, Light 50, Book 52.5, Bold 80 (fontconfig's
    "regular") and Black 90.
  -->

  <match target="scan">
    <test name="family"><string>Verlag Condensed</string></test>
    <test name="style" compare="contains"><string>Light</string></test>
    <edit name="weight"><const>light</const></edit>
  </match>

  <!-- must follow the Light rule above; "Extra Light" contains "Light" -->
  <match target="scan">
    <test name="family"><string>Verlag Condensed</string></test>
    <test name="style" compare="contains"><string>Extra Light</string></test>
    <edit name="weight"><const>extralight</const></edit>
  </match>

  <match target="scan">
    <test name="family"><string>Verlag Condensed</string></test>
    <test name="style" compare="contains"><string>Book</string></test>
    <edit name="weight"><const>regular</const></edit>
  </match>

  <match target="scan">
    <test name="family"><string>Verlag Condensed</string></test>
    <test name="style" compare="contains"><string>Bold</string></test>
    <edit name="weight"><const>bold</const></edit>
  </match>

  <match target="scan">
    <test name="family"><string>Verlag Condensed</string></test>
    <test name="style" compare="contains"><string>Black</string></test>
    <edit name="weight"><const>black</const></edit>
  </match>

</fontconfig>
